# =============================================================================
# Cloud Agentic AI — Configuration
# =============================================================================

agent:
  loop_interval_seconds: 60         # How often the agent runs (60 s)
  dry_run: true                     # Always overridden by the CLI: --live disables dry-run
  read_only_in_dry_run: true        # In dry-run, still run read-only tools (diagnosis, scans)
  require_approval: true            # High-impact actions wait for a human (paper Fig. 3)
  approval_mode: queue              # queue = dashboard/Slack approval, cli = console prompt
  high_impact_actions: [terminate, resize, snapshot_delete, freeze]
  approve_prod_stops: true          # Stopping an Environment=prod instance also needs approval
  multi_agent_consensus: false      # Optional FinOps/SecOps/DevOps LLM debate (escalates on failure)

llm:
  enabled: true                     # Used only when OPENAI_API_KEY is set
  model: gpt-4o
  temperature: 0.1

safety:
  guardrails: true                  # Schema / inventory / protection / grounding checks
  grounding_checks: true            # Telemetry must support the action (anti-hallucination)
  allow_terminate: true             # false = downgrade terminate to stop
  protected_tags:
    - Key: "PreserveInstance"
      Value: "true"

chat:
  llm_responses: false              # Rephrase chat answers with the LLM (needs OPENAI_API_KEY)

dashboard:
  pace_factor: 1.0                  # Scales the cosmetic "live thought" delays (0 = none)
  public_url: ""                    # Used in Slack approval links, e.g. https://ops.example.com

provider:
  name: aws                         # Cloud provider (aws | mock)
  region: ap-southeast-1

benchmarks:
  sysbench:
    enabled: false                  # Opt-in only: installs sysbench and loads every running instance
    timeout_seconds: 120

# ---------------------------------------------------------------------------
# Notification settings (optional)
# ---------------------------------------------------------------------------
notifications:
  slack_webhook: ""                  # Slack incoming webhook URL
  sns_topic_arn: ""                  # AWS SNS topic ARN for alerts

# ---------------------------------------------------------------------------
# Tool-specific thresholds
# ---------------------------------------------------------------------------

tools:
  idle_server:
    enabled: true
    cpu_threshold_percent: 5.0      # Below this = idle
    duration_minutes: 30            # Sustained idle window
    action: stop                    # Default: stop | terminate
    policy_tag: IdlePolicy          # Per-instance override: tag IdlePolicy=terminate|stop
    exclude_tags:
      - Key: "PreserveInstance"
        Value: "true"

  rightsizer:
    enabled: true
    cpu_threshold_percent: 20.0
    evaluation_days: 7
    action: recommend               # recommend | apply

  disk_cleanup:
    enabled: true
    unattached_days: 7
    snapshot_before_delete: true

  tag_enforcer:
    enabled: true
    required_tags:
      - Key: "Environment"
        Default: "untagged"
      - Key: "Owner"
        Default: "unknown"
      - Key: "Project"
        Default: "unassigned"

  scheduler:
    enabled: true
    business_hours:                 # Default window, evaluated in UTC
      start: "08:00"
      end: "18:00"
      timezone: "UTC"
    environment_hours:              # Per-Environment-tag windows (override the default)
      dev:  {start: "03:30", end: "13:30"}    # 09:00–19:00 IST
      qa:   {start: "03:30", end: "13:30"}
    target_tags:
      - Key: "Environment"
        Value: "dev"

  cost_monitor:
    enabled: true
    spike_threshold_percent: 120.0  # Alert if daily > 120% of baseline
    baseline_window_days: 30        # Rolling 30-day baseline
    action: alert                   # alert | freeze
    freeze_tags:                    # "freeze" stops running instances with these tags (never prod)
      - Key: "priority"
        Value: "low"
    freeze_environments: []

  # --- NEW AGENTIC TOOLS ---

  diagnose_server:
    enabled: true
    cpu_high_threshold: 85.0        # Diagnose when CPU >= this
    memory_high_threshold: 90.0     # ... or memory >= this (needs CloudWatch agent on AWS)
    auto_remediate: false           # If true (and not dry-run), safe fixes are applied
    service_name: ""                # Service restarted for service/JVM faults when auto_remediate

  security_auditor:
    enabled: true
    check_security_groups: true
    check_s3_public: true
    check_ebs_encryption: true
    dangerous_ports:                # Never open to 0.0.0.0/0
      - 22      # SSH
      - 3389    # RDP
      - 5432    # PostgreSQL
      - 1521    # Oracle
      - 3306    # MySQL
      - 6379    # Redis

  cross_domain:
    enabled: true
    cloudtrail_hours: 24            # How far back to look in CloudTrail / Security Hub / GuardDuty
    auto_trigger_on_cost_spike: true

  query_optimizer:
    enabled: true                    # RDS slow-query optimizer
    latency_threshold_ms: 100        # Trigger analysis above this read/write latency
    slow_query_threshold_ms: 1000    # Analyze queries slower than this
    max_queries_to_analyze: 10

  # --- NEW TOOLS (Phase 1) ---

  backup_manager:
    enabled: false                  # Set to true to enable automated backups
    retention_days: 30              # Keep snapshots for 30 days
    target_environments:            # Which environments to backup
      - prod
      - staging
    skip_if_tagged_with:            # Skip resources with these tags
      - Key: "Backup"
        Value: "false"
    schedule: "daily"               # daily | weekly

  cert_monitor:
    enabled: true                   # Certificate expiry monitoring
    warning_threshold_days:         # Alert thresholds
      - 30                          # 30 days warning
      - 14                          # 14 days high priority
      - 7                           # 7 days critical
    check_acm: true                 # Check AWS ACM certificates
    check_imported: true            # Check imported certificates
